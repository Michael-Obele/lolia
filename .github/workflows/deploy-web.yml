name: Deploy web

# The site is the same `build/` directory the two native shells load: one
# artifact, one thing to verify. It is served from a domain root on purpose —
# `/_app/...` is absolute because Capacitor and Tauri serve the app from an
# origin root, and a subpath deploy would need `paths.base`, which would in turn
# break both shells. See D19 in `.plan/decisions.md`.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The claim this workflow makes is "root URL, no paths.base". Prove it from
      # the artifact rather than from the config: every asset tag must start at
      # `/_app/`, with no path prefix in front of it.
      - name: Assert the build is root-relative
        run: |
          if grep -q '"/_app/' build/index.html; then
            echo "build/index.html references /_app at the domain root."
          else
            echo "::error::build/index.html does not reference /_app at the root — a base path has crept in and the native shells would break."
            exit 1
          fi

      # `secrets` cannot be read in a job-level `if`, so presence is decided in a
      # step and every later step asks this output. A fork or a repo without the
      # secrets gets a green run and a notice, not a red X on main.
      - name: Is Cloudflare configured?
        id: cloudflare
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set — skipping the Pages deploy. The build above still ran and is downloadable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: lolia-web
          path: build
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=lolia --branch=${{ github.head_ref || github.ref_name }}
