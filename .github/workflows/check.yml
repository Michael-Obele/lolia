name: Check

# One gate, two checkers. `bun run check` is the only command CI runs, so a
# green local run means a green CI run and there is nothing to keep in sync.
#
#   check:app      svelte-kit sync + svelte-check over tsconfig.json
#                  (`src/**` and vite.config.ts — .svelte files and TS alike)
#   check:scripts  tsc --noEmit over scripts/tsconfig.json
#                  (the Bun build scripts, which the app project must not see)
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless. Cancel it
# instead of paying for both.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `bun install` runs the `prepare` script, which is `svelte-kit sync`.
      # That generates `.svelte-kit/types` and `node_modules/$app`, without
      # which every `$app/*` import fails to resolve and svelte-check reports
      # a wall of false errors.
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check
