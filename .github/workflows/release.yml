name: Release

# A tag is the release. Three desktop runners build the same frontend with the
# same Tauri config, and one Android job builds the same frontend again for the
# Play Store — one source, five artifacts, all attached to the tag.
#
# release-please creates the tag with GITHUB_TOKEN, and a tag pushed by that
# token does not trigger a `push` workflow (GitHub suppresses recursive runs).
# `workflow_dispatch` is the documented exception, so release-please.yml
# dispatches this workflow explicitly with the tag it just cut. The `push`
# trigger stays for a tag pushed by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.2"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
          - label: Windows
            os: windows-latest
          - label: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # For a dispatched run the tag arrives as an input; for a tag push it is
      # the ref itself. One expression covers both.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 2 links WebKitGTK on Linux. Windows and macOS ship their own web
      # engine, so this step is the one platform-specific dependency.
      - name: Linux webkit and packaging libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: Install
        run: bun install --frozen-lockfile

      - name: Sync version
        run: bun run version:sync

      # `beforeBuildCommand` in tauri.conf.json runs the same sync and build the
      # web deploy does, so the desktop binary and the site are one artifact.
      - name: Build and attach to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Lolia ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Lolia ${{ inputs.tag || github.ref_name }}.

            Installers are **unsigned**. Windows shows a SmartScreen warning and macOS
            refuses the first launch until you allow it in System Settings. See the
            README for the details.

            Element data: CC BY-SA 3.0, from Bowserinator/Periodic-Table-JSON. The about
            page inside the app names the pinned commit.
          releaseDraft: true
          prerelease: false

  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    # A missing keystore must not block a desktop release, and a broken Android
    # toolchain must not either: the artifacts are uploaded when they exist and
    # the log says plainly what happened.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Capacitor 8 compiles against SDK 36 and needs a modern JDK to do it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # v3 still asks sdkmanager for `tools`, a package Google stopped serving;
      # that request is a hard failure there and only a warning from v4 onward.
      # See https://github.com/android-actions/setup-android#the-deprecated-tools-package
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install
        run: bun install --frozen-lockfile

      # Explicitly, because AGP 8.13 needs the platform and build-tools for the
      # compileSdk in android/variables.gradle (36). Relying on the runner image
      # or on `sdkDownload` makes the build depend on a machine we do not pin.
      - name: Install the SDK packages the build needs
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # The web assets have to exist before `cap sync` copies them into the
      # Android project, and `cap sync` has to run before Gradle sees a project.
      - name: Build the web app and sync it into Android
        run: |
          bun run version:sync
          bun run build
          bunx cap sync android

      - name: Decode the keystore, if the secret exists
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lolia.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the keystore in ANDROID_KEYSTORE_BASE64."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the AAB/APK will be UNSIGNED and cannot be uploaded to Play. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign."
          fi

      # `cap build android` signs only when it is given all four keystore
      # options: without them it builds the artifact and then exits 1 with
      # "Missing options. Please supply all options for android signing." That
      # is the unsigned path, and it is not an error in this repository — the
      # next step proves the artifact exists instead of trusting an exit code.
      - name: Build the bundle and the APK
        id: artifacts
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            for type in AAB APK; do
              bunx cap build android \
                --androidreleasetype "$type" \
                --keystorepath "$RUNNER_TEMP/lolia.keystore" \
                --keystorepass "$STORE_PASSWORD" \
                --keystorealias "$KEY_ALIAS" \
                --keystorealiaspass "$KEY_PASSWORD"
            done
          else
            echo "No keystore secret: building UNSIGNED. The AAB cannot go to Play, but it installs on a device."
            for type in AAB APK; do
              bunx cap build android --androidreleasetype "$type" || \
                echo "::warning::cap build android --androidreleasetype $type exited non-zero (expected without keystore options)."
            done
          fi

      - name: Report what was built
        run: |
          shopt -s nullglob
          found=0
          for file in \
            android/app/build/outputs/bundle/release/*.aab \
            android/app/build/outputs/apk/release/*.apk
          do
            echo "built: $file ($(du -h "$file" | cut -f1))"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "::warning::No Android artifact was produced. The release continues without one."
          fi

      - name: Upload the Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lolia-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # The README promises five artifacts on the release, so the Android ones
      # have to reach it too — a workflow artifact is not downloadable from the
      # releases page. The desktop job may not have created the draft yet, and
      # the upload can race it, so create the draft if it is missing and retry.
      - name: Attach the Android artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(android/app/build/outputs/bundle/release/*.aab android/app/build/outputs/apk/release/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No Android artifact was produced, so none was attached."
            exit 0
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Lolia $TAG" \
              --notes "Lolia $TAG. Element data: CC BY-SA 3.0, from Bowserinator/Periodic-Table-JSON."
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "${files[@]}" --clobber; then
              echo "attached ${#files[@]} Android artifact(s) to $TAG"
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Could not attach the Android artifacts to $TAG."
          exit 1
